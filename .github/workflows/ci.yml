name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Do not leave the repository's token in .git/config for dependency
          # scripts invoked by install, checks, or the extension build.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

      # Guards the npm release checker that gates publish-npm.yml; keeping it
      # green here keeps a broken gate from surfacing for the first time at
      # publish time.
      - run: node --test scripts/check-npm-release.test.mjs

      - run: bun run check:engine-package

      # Uses the committed development public key. Release builds override it
      # with their separate key, so this artifact is only for build inspection.
      # NOTE: `bun run --filter` (turbo syntax) does NOT scope the cwd in plain
      # bun — it runs the script from the repo root, so the ZIP would land in
      # ./.output/ instead of apps/extension/.output/. Working-directory pin:
      - name: Build extension ZIP
        working-directory: apps/extension
        run: bun run zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-unsigned-${{ github.sha }}
          path: apps/extension/.output/*.zip
          # upload-artifact filters hidden paths by default, even when the glob
          # names .output/ explicitly — without this the step finds nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
